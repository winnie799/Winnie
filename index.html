<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>音乐漫游指南 — 你的私人音乐鉴赏课</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%236B8E5A'><path d='M9 18V5l12-2v13'/><circle cx='6' cy='18' r='3'/><circle cx='18' cy='16' r='3'/></svg>">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap">
<style>
:root {
  --bg-primary: #F5F1E8;
  --bg-secondary: #EDE6D6;
  --bg-card: #FFFFFF;
  --bg-card-hover: #FAF7F0;
  --text-primary: #2C2416;
  --text-secondary: #5C503A;
  --text-muted: #8A7E66;
  --accent: #6B8E5A;
  --accent-dim: rgba(107, 142, 90, 0.12);
  --level-easy: #6B8E5A;
  --level-medium: #4A7BA6;
  --level-hard: #A67C52;
  --border: rgba(44, 36, 22, 0.08);
  --radius: 16px;
  --radius-sm: 10px;
  --shadow: 0 2px 12px rgba(44, 36, 22, 0.06);
  --shadow-hover: 0 8px 24px rgba(44, 36, 22, 0.1);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  line-height: 1.6;
  min-height: 100vh;
}
.bg-decoration {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  pointer-events: none; z-index: 0; overflow: hidden;
}
.bg-decoration::before {
  content: ''; position: absolute; top: -10%; right: -5%;
  width: 50%; height: 50%;
  background: radial-gradient(circle, rgba(107, 142, 90, 0.08) 0%, transparent 70%);
  border-radius: 50%;
}
.bg-decoration::after {
  content: ''; position: absolute; bottom: -15%; left: -5%;
  width: 40%; height: 40%;
  background: radial-gradient(circle, rgba(166, 124, 82, 0.06) 0%, transparent 70%);
  border-radius: 50%;
}
.navbar {
  position: sticky; top: 0; z-index: 100;
  background: rgba(245, 241, 232, 0.85);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  padding: 16px 32px;
  display: flex; align-items: center; justify-content: space-between;
}
.nav-brand {
  font-family: 'Noto Serif SC', serif;
  font-size: 18px; font-weight: 700; color: var(--accent);
  display: flex; align-items: center; gap: 8px; cursor: pointer;
}
.nav-brand svg { width: 22px; height: 22px; }
.nav-links { display: flex; gap: 8px; }
.nav-link {
  padding: 8px 16px; border-radius: var(--radius-sm);
  font-size: 14px; color: var(--text-secondary); cursor: pointer;
  transition: all 0.2s; border: none; background: transparent;
}
.nav-link:hover { color: var(--text-primary); background: var(--bg-secondary); }
.nav-link.active { color: var(--accent); background: var(--accent-dim); }
.container {
  position: relative; z-index: 1;
  max-width: 1200px; margin: 0 auto; padding: 0 32px;
}
.hero { padding: 72px 0 56px; text-align: center; }
.hero-title {
  font-family: 'Noto Serif SC', serif;
  font-size: 44px; font-weight: 900; line-height: 1.2; margin-bottom: 16px;
  color: var(--text-primary);
}
.hero-subtitle {
  font-size: 17px; color: var(--text-secondary);
  max-width: 560px; margin: 0 auto 32px; line-height: 1.8;
}
.hero-quote {
  font-family: 'Noto Serif SC', serif;
  font-size: 15px; color: var(--text-muted); font-style: italic;
  margin-bottom: 40px; padding-left: 16px;
  border-left: 3px solid var(--accent);
  display: inline-block; text-align: left;
}
.hero-actions { display: flex; gap: 12px; justify-content: center; }
.btn {
  padding: 14px 28px; border-radius: var(--radius-sm);
  font-size: 15px; font-weight: 500; cursor: pointer;
  transition: all 0.2s; border: none; font-family: inherit;
}
.btn-primary { background: var(--accent); color: white; }
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(107, 142, 90, 0.3); }
.btn-secondary { background: var(--bg-card); color: var(--text-primary); border: 1px solid var(--border); }
.btn-secondary:hover { background: var(--bg-card-hover); }
.stats-bar {
  display: flex; gap: 32px; justify-content: center;
  margin-bottom: 48px; flex-wrap: wrap;
}
.stat-item { text-align: center; }
.stat-number {
  font-family: 'Noto Serif SC', serif;
  font-size: 28px; font-weight: 700; color: var(--accent);
}
.stat-label { font-size: 13px; color: var(--text-muted); }
.filter-tabs {
  display: flex; gap: 8px; margin-bottom: 32px;
  flex-wrap: wrap; align-items: center;
}
.filter-tab {
  padding: 8px 16px; border-radius: 20px;
  font-size: 13px; cursor: pointer; transition: all 0.2s;
  border: 1px solid var(--border); background: transparent; color: var(--text-secondary);
}
.filter-tab:hover { border-color: var(--text-muted); color: var(--text-primary); }
.filter-tab.active { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }
.filter-label { font-size: 13px; color: var(--text-muted); margin-right: 4px; }
.section-title {
  font-family: 'Noto Serif SC', serif;
  font-size: 22px; font-weight: 700; margin: 40px 0 20px;
  display: flex; align-items: center; gap: 12px;
}
.section-title .level-dot { width: 10px; height: 10px; border-radius: 50%; }
.section-title .count { font-size: 14px; font-weight: 400; color: var(--text-muted); }
.tracks-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 16px;
}
.track-card {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 22px; cursor: pointer;
  transition: all 0.25s; position: relative; overflow: hidden;
  box-shadow: var(--shadow);
}
.track-card:hover {
  transform: translateY(-3px);
  box-shadow: var(--shadow-hover);
}
.track-card.completed { opacity: 0.7; }
.track-emoji { font-size: 32px; margin-bottom: 12px; }
.track-title {
  font-family: 'Noto Serif SC', serif;
  font-size: 18px; font-weight: 600; margin-bottom: 6px;
}
.track-composer { font-size: 13px; color: var(--text-secondary); margin-bottom: 12px; }
.track-tags { display: flex; gap: 6px; flex-wrap: wrap; }
.track-tag {
  font-size: 11px; padding: 3px 8px; border-radius: 4px;
  background: var(--bg-secondary); color: var(--text-muted);
}
.track-status {
  position: absolute; top: 16px; right: 16px;
  font-size: 12px; padding: 3px 8px; border-radius: 4px;
}
.status-completed { background: rgba(107, 142, 90, 0.15); color: var(--level-easy); }
.status-listening { background: var(--accent-dim); color: var(--accent); }
.track-card.custom {
  border-style: dashed; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  min-height: 160px; text-align: center;
}
.track-card.custom .plus-icon { font-size: 32px; color: var(--text-muted); margin-bottom: 8px; }
.track-card.custom .custom-text { font-size: 14px; color: var(--text-secondary); }
.detail-view { display: none; padding: 40px 0; }
.detail-view.active { display: block; }
.detail-back {
  display: inline-flex; align-items: center; gap: 6px;
  color: var(--text-secondary); cursor: pointer; font-size: 14px;
  margin-bottom: 24px; background: none; border: none; font-family: inherit;
}
.detail-back:hover { color: var(--accent); }
.detail-header {
  margin-bottom: 24px; padding: 32px;
  background: var(--bg-card); border-radius: var(--radius); border: 1px solid var(--border);
  box-shadow: var(--shadow);
}
.detail-title {
  font-family: 'Noto Serif SC', serif;
  font-size: 36px; font-weight: 700; margin-bottom: 8px;
}
.detail-meta { font-size: 15px; color: var(--text-secondary); margin-bottom: 16px; }
.detail-desc { font-size: 14px; color: var(--text-muted); line-height: 1.8; }
.player-bar {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 20px 24px;
  margin-bottom: 24px; display: flex; align-items: center; gap: 20px;
  box-shadow: var(--shadow);
}
.player-btn {
  width: 56px; height: 56px; border-radius: 50%;
  background: var(--accent); border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; transition: all 0.2s;
}
.player-btn:hover { transform: scale(1.05); box-shadow: 0 4px 20px rgba(107, 142, 90, 0.4); }
.player-btn svg { width: 24px; height: 24px; fill: white; }
.player-info { flex: 1; }
.player-title { font-size: 15px; font-weight: 500; margin-bottom: 4px; }
.player-sub { font-size: 12px; color: var(--text-muted); }
.player-visual { display: flex; align-items: flex-end; gap: 3px; height: 32px; }
.viz-bar {
  width: 4px; background: var(--accent); border-radius: 2px;
  transition: height 0.1s ease; height: 4px;
}
.player-link {
  font-size: 12px; color: var(--accent); text-decoration: none;
  padding: 6px 12px; border: 1px solid var(--accent);
  border-radius: var(--radius-sm); white-space: nowrap; transition: all 0.2s;
}
.player-link:hover { background: var(--accent-dim); }
.guide-steps { margin-bottom: 32px; }
.step-item {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius); margin-bottom: 12px;
  overflow: hidden; transition: all 0.25s;
  box-shadow: var(--shadow);
}
.step-item.unlocked { border-color: var(--accent); }
.step-item.locked { opacity: 0.5; }
.step-header {
  padding: 20px 24px; cursor: pointer;
  display: flex; align-items: center; gap: 16px;
}
.step-number {
  width: 32px; height: 32px; border-radius: 50%;
  background: var(--bg-secondary);
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 600; color: var(--text-secondary); flex-shrink: 0;
}
.step-item.unlocked .step-number { background: var(--accent-dim); color: var(--accent); }
.step-item.completed .step-number { background: rgba(107, 142, 90, 0.15); color: var(--level-easy); }
.step-title { font-size: 16px; font-weight: 500; flex: 1; }
.step-arrow { color: var(--text-muted); transition: transform 0.25s; }
.step-item.expanded .step-arrow { transform: rotate(180deg); }
.step-content { max-height: 0; overflow: hidden; transition: max-height 0.3s ease; }
.step-item.expanded .step-content { max-height: 800px; }
.step-inner { padding: 0 24px 24px 72px; }
.step-question { font-size: 15px; color: var(--text-secondary); margin-bottom: 16px; line-height: 1.8; }
.step-hint {
  font-size: 13px; color: var(--text-muted);
  padding: 12px 16px; background: var(--bg-secondary);
  border-radius: var(--radius-sm); margin-bottom: 16px;
}
.step-reveal {
  display: none; padding: 16px; background: var(--accent-dim);
  border-radius: var(--radius-sm); font-size: 14px; line-height: 1.8; color: var(--text-primary);
}
.step-reveal.show { display: block; }
.btn-reveal {
  padding: 8px 16px; font-size: 13px; background: transparent;
  border: 1px solid var(--accent); color: var(--accent);
  border-radius: var(--radius-sm); cursor: pointer; transition: all 0.2s; font-family: inherit;
}
.btn-reveal:hover { background: var(--accent-dim); }
.btn-complete-step {
  margin-top: 16px; padding: 10px 20px; font-size: 13px;
  background: var(--level-easy); color: white; border: none;
  border-radius: var(--radius-sm); cursor: pointer; font-family: inherit;
  opacity: 0.8; transition: all 0.2s;
}
.btn-complete-step:hover { opacity: 1; }
.my-list-view { display: none; padding: 40px 0; }
.my-list-view.active { display: block; }
.my-list-header { margin-bottom: 32px; }
.my-list-title {
  font-family: 'Noto Serif SC', serif;
  font-size: 32px; font-weight: 700; margin-bottom: 8px;
}
.my-list-subtitle { color: var(--text-secondary); font-size: 15px; }
.progress-overview {
  background: var(--bg-card); border-radius: var(--radius);
  padding: 24px; margin-bottom: 32px; border: 1px solid var(--border);
  box-shadow: var(--shadow);
}
.progress-bar {
  height: 8px; background: var(--bg-secondary); border-radius: 4px;
  overflow: hidden; margin: 12px 0;
}
.progress-fill {
  height: 100%; background: linear-gradient(90deg, var(--level-easy), var(--accent));
  border-radius: 4px; transition: width 0.5s ease;
}
.progress-stats { display: flex; gap: 24px; font-size: 13px; color: var(--text-muted); }
.empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); }
.empty-state .empty-icon { font-size: 48px; margin-bottom: 16px; opacity: 0.5; }
.empty-state p { font-size: 15px; }
.modal-overlay {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(44, 36, 22, 0.4); backdrop-filter: blur(4px);
  z-index: 200; display: none; align-items: center; justify-content: center; padding: 20px;
}
.modal-overlay.active { display: flex; }
.modal {
  background: var(--bg-card); border-radius: var(--radius);
  padding: 32px; width: 100%; max-width: 480px; border: 1px solid var(--border);
}
.modal-title {
  font-family: 'Noto Serif SC', serif;
  font-size: 20px; font-weight: 600; margin-bottom: 8px;
}
.modal-desc { font-size: 14px; color: var(--text-secondary); margin-bottom: 20px; }
.modal-input {
  width: 100%; padding: 12px 16px; background: var(--bg-primary);
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  color: var(--text-primary); font-size: 15px; font-family: inherit;
  margin-bottom: 20px; outline: none; transition: border-color 0.2s;
}
.modal-input:focus { border-color: var(--accent); }
.modal-actions { display: flex; gap: 12px; justify-content: flex-end; }
.toast {
  position: fixed; bottom: 32px; left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: var(--text-primary); color: var(--bg-primary);
  padding: 12px 24px; border-radius: var(--radius-sm);
  font-size: 14px; z-index: 300; transition: transform 0.3s ease;
}
.toast.show { transform: translateX(-50%) translateY(0); }
@media (max-width: 768px) {
  .navbar { padding: 12px 16px; }
  .container { padding: 0 16px; }
  .hero { padding: 48px 0 40px; }
  .hero-title { font-size: 30px; }
  .hero-subtitle { font-size: 16px; }
  .tracks-grid { grid-template-columns: 1fr; }
  .detail-title { font-size: 26px; }
  .step-inner { padding-left: 24px; }
  .player-bar { flex-wrap: wrap; }
}
</style>
</head>

function getMelody(trackId) { return melodies[trackId] || melodies[999]; }

function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    // 手机端：第一次用户点击页面时就 resume，激活音频上下文
    const resumeOnFirstInteraction = () => {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      document.removeEventListener('click', resumeOnFirstInteraction);
      document.removeEventListener('touchstart', resumeOnFirstInteraction);
    };
    document.addEventListener('click', resumeOnFirstInteraction);
    document.addEventListener('touchstart', resumeOnFirstInteraction);
  }
}

function playNote(frequency, startTime, duration, volume = 0.22) {
  if (!audioCtx) return;
  const osc1 = audioCtx.createOscillator();
  osc1.type = 'triangle';
  osc1.frequency.value = frequency;
  const osc2 = audioCtx.createOscillator();
  osc2.type = 'sine';
  osc2.frequency.value = frequency * 2;
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.value = 1800;
  filter.Q.value = 0.5;
  const gainNode = audioCtx.createGain();
  gainNode.gain.setValueAtTime(0, startTime);
  gainNode.gain.linearRampToValueAtTime(volume, startTime + 0.02);
  gainNode.gain.linearRampToValueAtTime(volume * 0.7, startTime + duration * 0.3);
  gainNode.gain.linearRampToValueAtTime(0, startTime + duration);
  osc1.connect(filter);
  osc2.connect(filter);
  filter.connect(gainNode);
  gainNode.connect(audioCtx.destination);
  osc1.start(startTime);
  osc2.start(startTime);
  osc1.stop(startTime + duration);
  osc2.stop(startTime + duration);
  activeOscs.push(osc1, osc2);
}

function togglePlay() { isPlaying ? stopPlay() : startPlay(); }

function startPlay() {
  initAudio();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  // 确保音频上下文激活后再排程（手机端兼容）
  if (audioCtx.state !== 'running') {
    audioCtx.resume().then(() => { scheduleNotes(); });
    return;
  }
  scheduleNotes();
}

function scheduleNotes() {
  const melody = getMelody(currentTrackId);
  const beatDuration = 0.45;
  let currentTime = audioCtx.currentTime + 0.1;
  melody.main.forEach(([note, beats]) => {
    const freq = NOTES[note];
    const duration = beats * beatDuration;
    if (freq) playNote(freq, currentTime, duration, 0.22);
    currentTime += duration;
  });
  let bassTime = audioCtx.currentTime + 0.1;
  melody.bass.forEach(([note, beats]) => {
    const freq = NOTES[note];
    const duration = beats * beatDuration;
    if (freq) playNote(freq, bassTime, duration, 0.1);
    bassTime += duration;
  });
  const totalDuration = (currentTime - audioCtx.currentTime) * 1000;
  isPlaying = true;
  document.getElementById('play-icon').style.display = 'none';
  document.getElementById('pause-icon').style.display = 'block';
  startVisual();
  playTimeout = setTimeout(() => stopPlay(), totalDuration);
}

function stopPlay() {
  isPlaying = false;
  if (playTimeout) clearTimeout(playTimeout);
  if (vizInterval) clearInterval(vizInterval);
  activeOscs.forEach(osc => { try { osc.stop(); } catch(e) {} });
  activeOscs = [];
  document.getElementById('play-icon').style.display = 'block';
  document.getElementById('pause-icon').style.display = 'none';
  document.querySelectorAll('.viz-bar').forEach(bar => bar.style.height = '4px');
}

function startVisual() {
  const bars = document.querySelectorAll('.viz-bar');
  vizInterval = setInterval(() => {
    bars.forEach(bar => bar.style.height = (isPlaying ? Math.random() * 28 + 4 : 4) + 'px');
  }, 120);
}

function init() { renderTracks(); updateStats(); }

function renderTracks() {
  const container = document.getElementById('tracks-container');
  const filtered = currentFilter === 'all' ? tracks : tracks.filter(t => t.level === currentFilter);
  const levels = [
    { key: 'easy', label: '入门 · 耳熟能详', dotColor: 'var(--level-easy)' },
    { key: 'medium', label: '进阶 · 经典配乐', dotColor: 'var(--level-medium)' },
    { key: 'hard', label: '深入 · 大师之作', dotColor: 'var(--level-hard)' },
  ];
  let html = '';
  levels.forEach(level => {
    const levelTracks = filtered.filter(t => t.level === level.key);
    if (levelTracks.length === 0) return;
    html += `
      <h2 class="section-title">
        <span class="level-dot" style="background: ${level.dotColor}"></span>
        ${level.label}
        <span class="count">（${levelTracks.length}首）</span>
      </h2>
      <div class="tracks-grid">
        ${levelTracks.map(t => renderTrackCard(t)).join('')}
        ${level.key === 'easy' ? renderCustomCard() : ''}
      </div>
    `;
  });
  container.innerHTML = html;
}

function renderTrackCard(track) {
  const status = userProgress[track.id];
  let statusHtml = '';
  if (status === 'completed') statusHtml = '<span class="track-status status-completed">已收藏</span>';
  else if (status === 'listening') statusHtml = '<span class="track-status status-listening">聆听中</span>';
  return `
    <div class="track-card ${status === 'completed' ? 'completed' : ''}"
         onclick="openDetail(${track.id})">
      ${statusHtml}
      <div class="track-emoji">${track.emoji}</div>
      <div class="track-title">${track.title}</div>
      <div class="track-composer">${track.composer} · ${track.era}</div>
      <div class="track-tags">
        <span class="track-tag">${track.level === 'easy' ? '入门' : track.level === 'medium' ? '进阶' : '深入'}</span>
      </div>
    </div>
  `;
}

function renderCustomCard() {
  return `
    <div class="track-card custom" onclick="openCustomModal()">
      <div class="plus-icon">+</div>
      <div class="custom-text">探索其他作品<br>输入你喜欢的任何曲名</div>
    </div>
  `;
}

function filterTracks(level) {
  currentFilter = level;
  document.querySelectorAll('.filter-tab').forEach(tab => {
    tab.classList.toggle('active', tab.dataset.level === level);
  });
  renderTracks();
}

function showView(view) {
  if (view !== 'detail' && isPlaying) stopPlay();
  document.getElementById('view-home').style.display = view === 'home' ? 'block' : 'none';
  document.getElementById('view-detail').classList.toggle('active', view === 'detail');
  document.getElementById('view-my').classList.toggle('active', view === 'my');
  document.getElementById('nav-home').classList.toggle('active', view === 'home' || view === 'detail');
  document.getElementById('nav-my').classList.toggle('active', view === 'my');
  if (view === 'my') renderMyList();
  if (view === 'home') renderTracks();
}

function openDetail(trackId) {
  currentTrackId = trackId;
  const track = tracks.find(t => t.id === trackId);
  if (!track) return;
  if (!userProgress[trackId]) { userProgress[trackId] = 'listening'; saveProgress(); }
  const steps = guideTemplates[track.level];
  let html = `
    <div class="detail-header">
      <div style="font-size: 14px; color: ${track.color}; margin-bottom: 8px;">
        ${track.level === 'easy' ? '入门' : track.level === 'medium' ? '进阶' : '深入'} · ${track.era}
      </div>
      <h1 class="detail-title">${track.emoji} ${track.title}</h1>
      <div class="detail-meta">${track.composer}</div>
      <p class="detail-desc">${track.desc}</p>
    </div>
    <div class="player-bar">
      <button class="player-btn" onclick="togglePlay()">
        <svg id="play-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        <svg id="pause-icon" viewBox="0 0 24 24" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
      </button>
      <div class="player-info">
        <div class="player-title">主题旋律片段</div>
        <div class="player-sub">钢琴音色 · 带低音伴奏 · 点击播放试听</div>
      </div>
      <div class="player-visual">
        ${Array(12).fill('<div class="viz-bar"></div>').join('')}
      </div>
      <a class="player-link" href="https://www.bilibili.com/search?keyword=${encodeURIComponent(track.title + ' ' + track.composer)}" target="_blank">
        去B站听完整版
      </a>
    </div>
    <div class="guide-steps">
      <h3 style="font-size: 18px; margin-bottom: 16px; font-family: 'Noto Serif SC', serif;">引导式聆听笔记</h3>
      ${steps.map((step, i) => renderStep(step, i, trackId)).join('')}
    </div>
    <div style="text-align: center; padding: 24px 0;">
      <button class="btn btn-primary" onclick="completeTrack(${trackId})">收藏这首曲子</button>
    </div>
  `;
  document.getElementById('detail-content').innerHTML = html;
  showView('detail');
  updateStats();
}

function renderStep(step, index, trackId) {
  const isUnlocked = index === 0 || userProgress[`step_${trackId}_${index - 1}`] === 'completed';
  const isCompleted = userProgress[`step_${trackId}_${index}`] === 'completed';
  return `
    <div class="step-item ${isUnlocked ? 'unlocked' : 'locked'} ${isCompleted ? 'completed' : ''}" id="step-${index}">
      <div class="step-header" onclick="toggleStep(${index})">
        <div class="step-number">${isCompleted ? '✓' : index + 1}</div>
        <div class="step-title">${step.title}</div>
        <svg class="step-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
      </div>
      <div class="step-content">
        <div class="step-inner">
          <p class="step-question">${step.question}</p>
          <div class="step-hint">${step.hint}</div>
          <div class="step-reveal" id="reveal-${index}">
            <strong>参考解读：</strong><br>${step.reveal}
          </div>
          <div style="display: flex; gap: 8px; flex-wrap: wrap;">
            <button class="btn-reveal" onclick="revealAnswer(${index})">看看参考解读</button>
            <button class="btn-complete-step" onclick="completeStep(${trackId}, ${index})">
              ${isCompleted ? '✓ 已完成' : '记下这一点'}
            </button>
          </div>
        </div>
      </div>
    </div>
  `;
}

function toggleStep(index) {
  const item = document.getElementById(`step-${index}`);
  if (item.classList.contains('locked')) { showToast('请先完成上一步'); return; }
  item.classList.toggle('expanded');
}

function revealAnswer(index) { document.getElementById(`reveal-${index}`).classList.add('show'); }

function completeStep(trackId, index) {
  userProgress[`step_${trackId}_${index}`] = 'completed';
  saveProgress();
  showToast('已记下这一点！');
  openDetail(trackId);
}

function completeTrack(trackId) {
  userProgress[trackId] = 'completed';
  saveProgress();
  showToast('已收藏这首曲子！');
  updateStats();
  setTimeout(() => showView('home'), 1000);
}

function renderMyList() {
  const container = document.getElementById('my-list-content');
  const completedTracks = tracks.filter(t => userProgress[t.id] === 'completed');
  const listeningTracks = tracks.filter(t => userProgress[t.id] === 'listening');
  const total = tracks.length;
  const completed = completedTracks.length;
  const easyTotal = tracks.filter(t => t.level === 'easy').length;
  const mediumTotal = tracks.filter(t => t.level === 'medium').length;
  const hardTotal = tracks.filter(t => t.level === 'hard').length;
  const easyDone = tracks.filter(t => t.level === 'easy' && userProgress[t.id] === 'completed').length;
  const mediumDone = tracks.filter(t => t.level === 'medium' && userProgress[t.id] === 'completed').length;
  const hardDone = tracks.filter(t => t.level === 'hard' && userProgress[t.id] === 'completed').length;
  document.getElementById('progress-text').textContent = `${completed} / ${total}`;
  document.getElementById('progress-fill').style.width = `${(completed / total) * 100}%`;
  document.getElementById('progress-easy').textContent = `${easyDone}/${easyTotal}`;
  document.getElementById('progress-medium').textContent = `${mediumDone}/${mediumTotal}`;
  document.getElementById('progress-hard').textContent = `${hardDone}/${hardTotal}`;
  if (completedTracks.length === 0 && listeningTracks.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">🎵</div>
        <p>还没有收藏任何曲子</p>
        <p style="font-size: 13px; margin-top: 8px;">从一首熟悉的旋律开始你的音乐之旅吧</p>
      </div>
    `;
    return;
  }
  let html = '';
  if (listeningTracks.length > 0) {
    html += `<h3 style="font-size: 16px; margin: 24px 0 12px; color: var(--accent);">聆听中</h3>`;
    html += `<div class="tracks-grid">${listeningTracks.map(t => renderTrackCard(t)).join('')}</div>`;
  }
  if (completedTracks.length > 0) {
    html += `<h3 style="font-size: 16px; margin: 24px 0 12px; color: var(--level-easy);">已收藏</h3>`;
    html += `<div class="tracks-grid">${completedTracks.map(t => renderTrackCard(t)).join('')}</div>`;
  }
  container.innerHTML = html;
}

function updateStats() {
  const total = tracks.length;
  const completed = tracks.filter(t => userProgress[t.id] === 'completed').length;
  document.getElementById('stat-total').textContent = total;
  document.getElementById('stat-completed').textContent = completed;
  document.getElementById('stat-progress').textContent = Math.round((completed / total) * 100) + '%';
}

function openCustomModal() {
  document.getElementById('custom-modal').classList.add('active');
  document.getElementById('custom-track-name').value = '';
  setTimeout(() => document.getElementById('custom-track-name').focus(), 100);
}

function closeCustomModal() { document.getElementById('custom-modal').classList.remove('active'); }

function startCustomTrack() {
  const name = document.getElementById('custom-track-name').value.trim();
  if (!name) { showToast('请输入曲名'); return; }
  closeCustomModal();
  showToast(`已创建「${name}」的聆听笔记`);
  const fakeTrack = {
    id: 999, emoji: '🎼', title: name, composer: '自定义作品', era: '未知时期',
    level: 'medium', color: '#6B8E5A', desc: '这是你自定义的曲目，引导问题会根据难度生成。'
  };
  tracks.push(fakeTrack);
  openDetail(999);
}

function saveProgress() { localStorage.setItem('musicProgress', JSON.stringify(userProgress)); }

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2000);
}

function scrollToTracks() {
  document.getElementById('tracks-container').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

document.getElementById('custom-modal').addEventListener('click', function(e) {
  if (e.target === this) closeCustomModal();
});
document.getElementById('custom-track-name').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') startCustomTrack();
});

init();
</script>
</body>
</html>
